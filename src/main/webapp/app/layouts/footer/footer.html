<footer class="footer py-3">
  <div class="footer-content d-flex justify-content-between align-items-center px-4">
    <div><strong>Super ERP</strong> © {{ currentYear }}</div>

    <div class="footer-toggles d-flex align-items-center gap-3">
      <mat-button-toggle-group [value]="selectedTheme" (change)="setDarkMode($event.value)" hideSingleSelectionIndicator="true">
        <mat-button-toggle [value]="false">
          <mat-icon>light_mode</mat-icon>
          <span>{{ 'global.footer.lightMode' | translate }}</span>
        </mat-button-toggle>
        <mat-button-toggle [value]="true">
          <mat-icon>dark_mode</mat-icon>
          <span>{{ 'global.footer.darkMode' | translate }}</span>
        </mat-button-toggle>
      </mat-button-toggle-group>

      <mat-button-toggle-group [value]="selectedLanguage" (change)="changeLanguage($event.value)" hideSingleSelectionIndicator="true">
        <mat-button-toggle value="pt-br">
          <div class="d-flex align-items-center gap-2">
            <span>Português</span>
            <img src="content/images/flags/4x3/br.svg" width="20" height="15" alt="flag" />
          </div>
        </mat-button-toggle>
        <mat-button-toggle value="en">
          <div class="d-flex align-items-center gap-2">
            <span>English</span>
            <img src="content/images/flags/4x3/us.svg" width="20" height="15" alt="flag" />
          </div>
        </mat-button-toggle>
        <mat-button-toggle value="es">
          <div class="d-flex align-items-center gap-2">
            <span>Español</span>
            <img src="content/images/flags/4x3/es.svg" width="20" height="15" alt="flag" />
          </div>
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>
</footer>
