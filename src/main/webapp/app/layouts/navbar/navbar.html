<nav data-cy="navbar" class="navbar">
  <div class="navbar-content">
    <div class="navbar-container">
      <div class="navbar-brand-section">
        <a class="navbar-brand" routerLink="/" (click)="collapseNavbar()">
          <span class="logo-img"></span>
          <span class="navbar-title" jhiTranslate="global.title">Super-erp</span>
          @if (version) {
            <span class="navbar-version">{{ version }}</span>
          }
        </a>
      </div>

      <div class="navbar-search-section">
        <p-iconfield>
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input pInputText [placeholder]="'global.menu.search' | translate" class="search-input" />
        </p-iconfield>
      </div>

      <button class="navbar-toggler" (click)="isNavbarCollapsed.update(c => !c)" aria-label="Toggle navigation">
        <i class="pi pi-bars"></i>
      </button>

      <div class="navbar-menu-section" [class.show]="!isNavbarCollapsed()">
        @if (account() !== null) {
          <button class="nav-btn" (click)="entityMenuRef.toggle($event)" data-cy="entity">
            <i class="pi pi-th-large"></i>
            <span jhiTranslate="global.menu.entities.main">Entidades</span>
          </button>
          <p-menu #entityMenuRef [model]="entityMenuItems" [popup]="true" />
          <!-- jhipster-needle-add-entity-to-menu - JHipster will add entities to the menu here -->
        }

        <ng-container *jhiHasAnyAuthority="'ROLE_ADMIN'">
          <button class="nav-btn" (click)="adminMenuRef.toggle($event)" data-cy="adminMenu">
            <i class="pi pi-sliders-h"></i>
            <span jhiTranslate="global.menu.admin.main">Administração</span>
          </button>
          <p-menu #adminMenuRef [model]="adminMenuItems" [popup]="true" />
          <!-- jhipster-needle-add-element-to-admin-menu - JHipster will add entities to the admin menu here -->
        </ng-container>
      </div>

      <div class="navbar-account-section">
        <button class="nav-btn" (click)="accountMenuRef.toggle($event)" data-cy="accountMenu">
          @let accountRef = account();
          @if (!accountRef?.imageUrl) {
            <i class="pi pi-user"></i>
            <span jhiTranslate="global.menu.account.main">Conta</span>
          } @else {
            <img [src]="accountRef!.imageUrl" class="profile-image rounded-circle" alt="Avatar" />
          }
        </button>
        <p-menu #accountMenuRef [model]="account() !== null ? loggedInMenuItems : loggedOutMenuItems" [popup]="true" />
      </div>
    </div>
  </div>
</nav>
