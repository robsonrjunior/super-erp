<mat-card class="login-card">
  <h1 data-cy="loginTitle" jhiTranslate="login.title">Autenticação</h1>

  @if (authenticationError()) {
    <div class="login-error" data-cy="loginError">
      <mat-icon>error</mat-icon>
      <span>{{ 'login.messages.error.authentication' | translate }}</span>
    </div>
  }

  <form (ngSubmit)="login()" #loginRef="ngForm">
    <mat-form-field appearance="outline" class="field">
      <mat-label jhiTranslate="global.form.username.label">Usuário</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input
        #username
        matInput
        type="text"
        name="username"
        id="username"
        placeholder="{{ 'global.form.username.placeholder' | translate }}"
        [(ngModel)]="loginForm.username"
        data-cy="username"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label jhiTranslate="login.form.password">Senha</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input
        matInput
        type="password"
        name="password"
        id="password"
        placeholder="{{ 'login.form.password.placeholder' | translate }}"
        [(ngModel)]="loginForm.password"
        data-cy="password"
      />
    </mat-form-field>

    <div class="forgot-password">
      <a routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector" jhiTranslate="login.password.forgot"
        >Esqueceu sua senha?</a
      >
    </div>

    <mat-checkbox name="rememberMe" id="rememberMe" [(ngModel)]="loginForm.rememberMe" data-cy="rememberMe">
      <span jhiTranslate="login.form.rememberme">Manter-me logado</span>
    </mat-checkbox>

    <div class="form-actions">
      <a class="register-link" routerLink="/account/register" jhiTranslate="global.messages.info.register.link">Crie uma nova conta</a>
      <button mat-raised-button color="primary" type="submit" data-cy="submit">
        {{ 'login.form.button' | translate }}
      </button>
    </div>
  </form>
</mat-card>
