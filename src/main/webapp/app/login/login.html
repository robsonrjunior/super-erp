<p-card class="login-card">
  <h1 data-cy="loginTitle" jhiTranslate="login.title">Autenticação</h1>

  @if (authenticationError()) {
    <p-message severity="error" data-cy="loginError" [text]="'login.messages.error.authentication' | translate" />
  }

  <form (ngSubmit)="login()" #loginRef="ngForm">
    <div class="field">
      <label for="username" jhiTranslate="global.form.username.label">Usuário</label>
      <p-iconfield>
        <p-inputicon class="pi pi-user" />
        <input
          #username
          pInputText
          type="text"
          name="username"
          id="username"
          placeholder="{{ 'global.form.username.placeholder' | translate }}"
          [(ngModel)]="loginForm.username"
          data-cy="username"
        />
      </p-iconfield>
    </div>

    <div class="field">
      <label for="password" jhiTranslate="login.form.password">Senha</label>
      <p-iconfield>
        <p-inputicon class="pi pi-lock" />
        <input
          pInputText
          type="password"
          name="password"
          id="password"
          placeholder="{{ 'login.form.password.placeholder' | translate }}"
          [(ngModel)]="loginForm.password"
          data-cy="password"
        />
      </p-iconfield>
    </div>

    <div class="forgot-password">
      <a routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector" jhiTranslate="login.password.forgot"
        >Esqueceu sua senha?</a
      >
    </div>

    <div class="field-checkbox">
      <p-checkbox name="rememberMe" id="rememberMe" [(ngModel)]="loginForm.rememberMe" inputId="rememberMe" [binary]="true" />
      <label for="rememberMe" jhiTranslate="login.form.rememberme">Manter-me logado</label>
    </div>

    <div class="form-actions">
      <a class="register-link" routerLink="/account/register" jhiTranslate="global.messages.info.register.link">Crie uma nova conta</a>
      <p-button type="submit" data-cy="submit" [label]="'login.form.button' | translate" />
    </div>
  </form>
</p-card>
